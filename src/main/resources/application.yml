server:
  port: ${SERVER_PORT}

spring:
  datasource:
    url: jdbc:mysql://${MYSQL_URL}/demo?useUnicode=true&characterEncoding=utf8&useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true&rewriteBatchedStatements=true&createDatabaseIfNotExist=true
    username: ${MYSQL_USERNAME}
    password: ${MYSQL_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      maximum-pool-size: ${HIKARI_MAXIMUM_POOL_SIZE}
  redis:
    host: ${REDIS_HOST}
    port: ${REDIS_PORT}
    database: ${REDIS_DATABASE}
    password: ${REDIS_PASSWORD}
    timeout: 3000ms
  servlet:
    multipart:
      max-file-size: ${SPRING_SERVLET_MULTIPART_MAX_FILE_SIZE:200MB}
      max-request-size: ${SPRING_SERVLET_MULTIPART_MAX_REQUEST_SIZE:200MB}

mybatis:
  mapper-locations: classpath:mapper/*.xml
  type-aliases-package: com.huang.demo.excel.model
  configuration:
    map-underscore-to-camel-case: true

app:
  task:
    init-enabled: ${TASK_CENTER_INIT_ENABLED:true}
    redis-key-prefix: ${TASK_CENTER_REDIS_KEY_PREFIX:task:center:}
    cache-retention-hours: ${TASK_CENTER_CACHE_RETENTION_HOURS:24}
    max-page-size: ${TASK_CENTER_MAX_PAGE_SIZE:100}
    default-owner-id: ${TASK_CENTER_DEFAULT_OWNER_ID:anonymous}
    max-retry-count: ${TASK_CENTER_MAX_RETRY_COUNT:3}
  excel:
    export-page-size: 5000
    sheet-row-limit: 1048575
    import-batch-size: 2000
    import-worker-count: ${IMPORT_WORKER_COUNT:4}
    import-max-concurrent-tasks: ${IMPORT_MAX_CONCURRENT_TASKS:1}
    import-queue-capacity: ${IMPORT_QUEUE_CAPACITY:20}
    import-executor-queue-capacity: ${IMPORT_EXECUTOR_QUEUE_CAPACITY:20}
    import-await-termination-seconds: ${IMPORT_AWAIT_TERMINATION_SECONDS:30}
    import-worker-finish-wait-seconds: ${IMPORT_WORKER_FINISH_WAIT_SECONDS:0}
    import-transaction-timeout-seconds: ${IMPORT_TRANSACTION_TIMEOUT_SECONDS:60}
    import-max-retry-times: ${IMPORT_MAX_RETRY_TIMES:3}
    import-retry-backoff-millis: ${IMPORT_RETRY_BACKOFF_MILLIS:200}
    import-progress-log-interval: ${IMPORT_PROGRESS_LOG_INTERVAL:50}
    import-batch-sort-enabled: ${IMPORT_BATCH_SORT_ENABLED:true}
    insert-batch-size: 2000
    demo-seed-count: 12000
    export-temp-dir: ${EXPORT_TEMP_DIR:${java.io.tmpdir}/student-excel-export}
    export-file-retention-hours: 24
    export-core-pool-size: ${EXPORT_CORE_POOL_SIZE:2}
    export-max-pool-size: ${EXPORT_MAX_POOL_SIZE:2}
    export-queue-capacity: ${EXPORT_QUEUE_CAPACITY:10}
    export-await-termination-seconds: ${EXPORT_AWAIT_TERMINATION_SECONDS:30}
    export-rejected-execution-policy: ${EXPORT_REJECTED_EXECUTION_POLICY:abort}
  minio:
    endpoint: ${MINIO_ENDPOINT}
    access-key: ${MINIO_ACCESS_KEY}
    secret-key: ${MINIO_SECRET_KEY}
    bucket-name: ${MINIO_BUCKET_NAME:student-excel}
    export-object-prefix: ${MINIO_EXPORT_OBJECT_PREFIX:excel/student}
    download-url-expire-minutes: ${MINIO_DOWNLOAD_URL_EXPIRE_MINUTES:30}
    lifecycle-enabled: ${MINIO_LIFECYCLE_ENABLED:true}
    lifecycle-expire-days: ${MINIO_LIFECYCLE_EXPIRE_DAYS:1}
  file:
    init-enabled: ${FILE_CENTER_INIT_ENABLED:true}
    object-prefix: ${FILE_CENTER_OBJECT_PREFIX:files/general}
    multipart-object-prefix: ${FILE_CENTER_MULTIPART_OBJECT_PREFIX:files/multipart}
    download-url-expire-minutes: ${FILE_CENTER_DOWNLOAD_URL_EXPIRE_MINUTES:30}
    upload-url-expire-minutes: ${FILE_CENTER_UPLOAD_URL_EXPIRE_MINUTES:30}
    multipart-part-size: ${FILE_CENTER_MULTIPART_PART_SIZE:8388608}
    multipart-max-part-count: ${FILE_CENTER_MULTIPART_MAX_PART_COUNT:1000}
    max-page-size: ${FILE_CENTER_MAX_PAGE_SIZE:100}
    cors-enabled: ${FILE_CENTER_CORS_ENABLED:true}
    cors-allowed-origin-patterns: ${FILE_CENTER_CORS_ALLOWED_ORIGIN_PATTERNS:http://localhost:*,http://127.0.0.1:*,null}
