server:
  port: ${SERVER_PORT}

spring:
  datasource:
    url: jdbc:mysql://${MYSQL_URL}/demo?useUnicode=true&characterEncoding=utf8&useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true&rewriteBatchedStatements=true&createDatabaseIfNotExist=true
    username: ${MYSQL_USERNAME}
    password: ${MYSQL_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      maximum-pool-size: ${HIKARI_MAXIMUM_POOL_SIZE}
  flyway:
    enabled: ${FLYWAY_ENABLED:false}
    locations: classpath:db/migration
    baseline-on-migrate: ${FLYWAY_BASELINE_ON_MIGRATE:true}
    baseline-version: ${FLYWAY_BASELINE_VERSION:0}
  redis:
    host: ${REDIS_HOST}
    port: ${REDIS_PORT}
    database: ${REDIS_DATABASE}
    password: ${REDIS_PASSWORD}
    timeout: 3000ms
  servlet:
    multipart:
      max-file-size: ${SPRING_SERVLET_MULTIPART_MAX_FILE_SIZE:200MB}
      max-request-size: ${SPRING_SERVLET_MULTIPART_MAX_REQUEST_SIZE:200MB}

mybatis:
  mapper-locations: classpath:mapper/*.xml
  type-aliases-package: com.huang.demo.excel.model
  configuration:
    map-underscore-to-camel-case: true

app:
  security:
    init-enabled: ${API_SECURITY_INIT_ENABLED:true}
    demo-mode: ${API_SECURITY_DEMO_MODE:true}
    demo-user-token: ${API_SECURITY_DEMO_USER_TOKEN:}
    demo-admin-token: ${API_SECURITY_DEMO_ADMIN_TOKEN:}
    demo-default-user-id: ${TASK_CENTER_DEFAULT_OWNER_ID:anonymous}
    jwt-secret: ${API_SECURITY_JWT_SECRET:}
    access-token-expire-minutes: ${API_SECURITY_ACCESS_TOKEN_EXPIRE_MINUTES:60}
    refresh-token-expire-minutes: ${API_SECURITY_REFRESH_TOKEN_EXPIRE_MINUTES:10080}
    bootstrap-admin-enabled: ${API_SECURITY_BOOTSTRAP_ADMIN_ENABLED:false}
    bootstrap-admin-user-id: ${API_SECURITY_BOOTSTRAP_ADMIN_USER_ID:admin}
    bootstrap-admin-username: ${API_SECURITY_BOOTSTRAP_ADMIN_USERNAME:}
    bootstrap-admin-password: ${API_SECURITY_BOOTSTRAP_ADMIN_PASSWORD:}
  resilience:
    rate-limit:
      enabled: ${RATE_LIMIT_ENABLED:true}
      window-seconds: ${RATE_LIMIT_WINDOW_SECONDS:60}
      user-limit: ${RATE_LIMIT_USER_LIMIT:30}
      global-limit: ${RATE_LIMIT_GLOBAL_LIMIT:300}
      cleanup-max-keys: ${RATE_LIMIT_CLEANUP_MAX_KEYS:1000}
  compensation:
    auto-execute-enabled: ${COMPENSATION_AUTO_EXECUTE_ENABLED:true}
    auto-execute-initial-delay-millis: ${COMPENSATION_AUTO_EXECUTE_INITIAL_DELAY_MILLIS:60000}
    auto-execute-fixed-delay-millis: ${COMPENSATION_AUTO_EXECUTE_FIXED_DELAY_MILLIS:60000}
    auto-execute-batch-size: ${COMPENSATION_AUTO_EXECUTE_BATCH_SIZE:20}
    auto-execute-lock-key: ${COMPENSATION_AUTO_EXECUTE_LOCK_KEY:compensation:auto-execute:lock}
    auto-execute-lock-ttl-seconds: ${COMPENSATION_AUTO_EXECUTE_LOCK_TTL_SECONDS:300}
    retry-backoff-base-seconds: ${COMPENSATION_RETRY_BACKOFF_BASE_SECONDS:60}
    retry-backoff-max-seconds: ${COMPENSATION_RETRY_BACKOFF_MAX_SECONDS:3600}
  task:
    init-enabled: ${TASK_CENTER_INIT_ENABLED:true}
    redis-key-prefix: ${TASK_CENTER_REDIS_KEY_PREFIX:task:center:}
    cache-retention-hours: ${TASK_CENTER_CACHE_RETENTION_HOURS:24}
    max-page-size: ${TASK_CENTER_MAX_PAGE_SIZE:100}
    default-owner-id: ${TASK_CENTER_DEFAULT_OWNER_ID:anonymous}
    max-retry-count: ${TASK_CENTER_MAX_RETRY_COUNT:3}
    max-active-tasks-per-owner: ${TASK_CENTER_MAX_ACTIVE_TASKS_PER_OWNER:10}
    max-active-tasks-total: ${TASK_CENTER_MAX_ACTIVE_TASKS_TOTAL:50}
    recovery-enabled: ${TASK_RECOVERY_ENABLED:true}
    worker-id: ${TASK_WORKER_ID:}
    recovery-heartbeat-timeout-seconds: ${TASK_RECOVERY_HEARTBEAT_TIMEOUT_SECONDS:120}
    recovery-batch-size: ${TASK_RECOVERY_BATCH_SIZE:20}
    recovery-initial-delay-millis: ${TASK_RECOVERY_INITIAL_DELAY_MILLIS:30000}
    recovery-fixed-delay-millis: ${TASK_RECOVERY_FIXED_DELAY_MILLIS:60000}
    recovery-lock-key: ${TASK_RECOVERY_LOCK_KEY:task:recovery:lock}
    recovery-lock-ttl-seconds: ${TASK_RECOVERY_LOCK_TTL_SECONDS:300}
    execution-lock-key-prefix: ${TASK_EXECUTION_LOCK_KEY_PREFIX:task:execution:}
    execution-lock-ttl-seconds: ${TASK_EXECUTION_LOCK_TTL_SECONDS:3600}
  excel:
    init-enabled: ${EXCEL_INIT_ENABLED:true}
    export-page-size: ${EXPORT_PAGE_SIZE:5000}
    sheet-row-limit: 1048575
    import-batch-size: ${IMPORT_BATCH_SIZE:2000}
    import-max-rows-per-task: ${IMPORT_MAX_ROWS_PER_TASK:200000}
    import-max-file-size-for-async: ${IMPORT_MAX_FILE_SIZE_FOR_ASYNC:104857600}
    import-merge-chunk-size: ${IMPORT_MERGE_CHUNK_SIZE:5000}
    import-auto-recovery-enabled: ${IMPORT_AUTO_RECOVERY_ENABLED:false}
    import-worker-count: ${IMPORT_WORKER_COUNT:4}
    import-max-concurrent-tasks: ${IMPORT_MAX_CONCURRENT_TASKS:1}
    import-queue-capacity: ${IMPORT_QUEUE_CAPACITY:20}
    import-executor-queue-capacity: ${IMPORT_EXECUTOR_QUEUE_CAPACITY:20}
    import-task-core-pool-size: ${IMPORT_TASK_CORE_POOL_SIZE:1}
    import-task-max-pool-size: ${IMPORT_TASK_MAX_POOL_SIZE:1}
    import-task-queue-capacity: ${IMPORT_TASK_QUEUE_CAPACITY:10}
    import-await-termination-seconds: ${IMPORT_AWAIT_TERMINATION_SECONDS:30}
    import-worker-finish-wait-seconds: ${IMPORT_WORKER_FINISH_WAIT_SECONDS:0}
    import-transaction-timeout-seconds: ${IMPORT_TRANSACTION_TIMEOUT_SECONDS:60}
    import-max-retry-times: ${IMPORT_MAX_RETRY_TIMES:3}
    import-retry-backoff-millis: ${IMPORT_RETRY_BACKOFF_MILLIS:200}
    import-progress-log-interval: ${IMPORT_PROGRESS_LOG_INTERVAL:50}
    import-batch-sort-enabled: ${IMPORT_BATCH_SORT_ENABLED:true}
    insert-batch-size: 2000
    demo-seed-count: 12000
    export-temp-dir: ${EXPORT_TEMP_DIR:${java.io.tmpdir}/student-excel-export}
    import-temp-dir: ${IMPORT_TEMP_DIR:${java.io.tmpdir}/student-excel-import}
    export-file-retention-hours: 24
    export-core-pool-size: ${EXPORT_CORE_POOL_SIZE:2}
    export-max-pool-size: ${EXPORT_MAX_POOL_SIZE:2}
    export-queue-capacity: ${EXPORT_QUEUE_CAPACITY:10}
    export-await-termination-seconds: ${EXPORT_AWAIT_TERMINATION_SECONDS:30}
    export-rejected-execution-policy: ${EXPORT_REJECTED_EXECUTION_POLICY:abort}
    task-compensation-enabled: ${EXCEL_TASK_COMPENSATION_ENABLED:true}
    task-compensation-initial-delay-millis: ${EXCEL_TASK_COMPENSATION_INITIAL_DELAY_MILLIS:600000}
    task-compensation-fixed-delay-millis: ${EXCEL_TASK_COMPENSATION_FIXED_DELAY_MILLIS:3600000}
    task-compensation-batch-size: ${EXCEL_TASK_COMPENSATION_BATCH_SIZE:100}
    task-compensation-lock-key: ${EXCEL_TASK_COMPENSATION_LOCK_KEY:task:compensation:lock}
    task-compensation-lock-ttl-seconds: ${EXCEL_TASK_COMPENSATION_LOCK_TTL_SECONDS:300}
  minio:
    endpoint: ${MINIO_ENDPOINT}
    public-endpoint: ${MINIO_PUBLIC_ENDPOINT:}
    access-key: ${MINIO_ACCESS_KEY}
    secret-key: ${MINIO_SECRET_KEY}
    bucket-name: ${MINIO_BUCKET_NAME:student-excel}
    export-object-prefix: ${MINIO_EXPORT_OBJECT_PREFIX:excel/student}
    import-source-object-prefix: ${MINIO_IMPORT_SOURCE_OBJECT_PREFIX:excel/student/import-source}
    import-error-object-prefix: ${MINIO_IMPORT_ERROR_OBJECT_PREFIX:excel/student/import-error}
    download-url-expire-minutes: ${MINIO_DOWNLOAD_URL_EXPIRE_MINUTES:30}
    lifecycle-enabled: ${MINIO_LIFECYCLE_ENABLED:true}
    lifecycle-expire-days: ${MINIO_LIFECYCLE_EXPIRE_DAYS:1}
    import-source-retention-days: ${MINIO_IMPORT_SOURCE_RETENTION_DAYS:1}
    connect-timeout-millis: ${MINIO_CONNECT_TIMEOUT_MILLIS:3000}
    write-timeout-millis: ${MINIO_WRITE_TIMEOUT_MILLIS:60000}
    read-timeout-millis: ${MINIO_READ_TIMEOUT_MILLIS:60000}
    max-retry-times: ${MINIO_MAX_RETRY_TIMES:2}
    retry-backoff-millis: ${MINIO_RETRY_BACKOFF_MILLIS:200}
  file:
    init-enabled: ${FILE_CENTER_INIT_ENABLED:true}
    object-prefix: ${FILE_CENTER_OBJECT_PREFIX:files/general}
    multipart-object-prefix: ${FILE_CENTER_MULTIPART_OBJECT_PREFIX:files/multipart}
    download-url-expire-minutes: ${FILE_CENTER_DOWNLOAD_URL_EXPIRE_MINUTES:30}
    upload-url-expire-minutes: ${FILE_CENTER_UPLOAD_URL_EXPIRE_MINUTES:30}
    upload-operation-lock-key-prefix: ${FILE_CENTER_UPLOAD_OPERATION_LOCK_KEY_PREFIX:file:upload:operation:}
    upload-operation-lock-ttl-seconds: ${FILE_CENTER_UPLOAD_OPERATION_LOCK_TTL_SECONDS:1800}
    multipart-part-size: ${FILE_CENTER_MULTIPART_PART_SIZE:8388608}
    multipart-max-part-count: ${FILE_CENTER_MULTIPART_MAX_PART_COUNT:1000}
    max-page-size: ${FILE_CENTER_MAX_PAGE_SIZE:100}
    max-file-size-bytes: ${FILE_CENTER_MAX_FILE_SIZE_BYTES:0}
    max-total-storage-bytes-per-owner: ${FILE_CENTER_MAX_TOTAL_STORAGE_BYTES_PER_OWNER:0}
    max-active-upload-tasks-per-owner: ${FILE_CENTER_MAX_ACTIVE_UPLOAD_TASKS_PER_OWNER:20}
    max-daily-upload-count-per-owner: ${FILE_CENTER_MAX_DAILY_UPLOAD_COUNT_PER_OWNER:0}
    reconciliation-enabled: ${FILE_CENTER_RECONCILIATION_ENABLED:true}
    reconciliation-initial-delay-millis: ${FILE_CENTER_RECONCILIATION_INITIAL_DELAY_MILLIS:600000}
    reconciliation-fixed-delay-millis: ${FILE_CENTER_RECONCILIATION_FIXED_DELAY_MILLIS:3600000}
    reconciliation-batch-size: ${FILE_CENTER_RECONCILIATION_BATCH_SIZE:200}
    reconciliation-upload-stale-hours: ${FILE_CENTER_RECONCILIATION_UPLOAD_STALE_HOURS:24}
    reconciliation-lock-key: ${FILE_CENTER_RECONCILIATION_LOCK_KEY:file:reconciliation:lock}
    reconciliation-lock-ttl-seconds: ${FILE_CENTER_RECONCILIATION_LOCK_TTL_SECONDS:1800}
    cors-enabled: ${FILE_CENTER_CORS_ENABLED:true}
    cors-allowed-origin-patterns: ${FILE_CENTER_CORS_ALLOWED_ORIGIN_PATTERNS:http://localhost:*,http://127.0.0.1:*,null}
    security-scan-enabled: ${FILE_CENTER_SECURITY_SCAN_ENABLED:true}
    allowed-upload-extensions: ${FILE_CENTER_ALLOWED_UPLOAD_EXTENSIONS:txt,csv,json,xml,md,log,properties,yaml,yml,pdf,png,jpg,jpeg,gif,bmp,zip,docx,xlsx,pptx,bin,mp3,mp4,rar,7z}
    allowed-upload-mime-types: ${FILE_CENTER_ALLOWED_UPLOAD_MIME_TYPES:text/plain,text/csv,application/json,application/xml,text/xml,application/pdf,image/png,image/jpeg,image/gif,image/bmp,application/zip,application/x-zip-compressed,application/vnd.openxmlformats-officedocument.wordprocessingml.document,application/vnd.openxmlformats-officedocument.spreadsheetml.sheet,application/vnd.openxmlformats-officedocument.presentationml.presentation,application/octet-stream,application/x-rar-compressed,application/x-7z-compressed,audio/mpeg,video/mp4}
  cleanup:
    enabled: ${DATA_CLEANUP_ENABLED:true}
    initial-delay-millis: ${DATA_CLEANUP_INITIAL_DELAY_MILLIS:300000}
    fixed-delay-millis: ${DATA_CLEANUP_FIXED_DELAY_MILLIS:3600000}
    batch-size: ${DATA_CLEANUP_BATCH_SIZE:200}
    task-retention-hours: ${DATA_CLEANUP_TASK_RETENTION_HOURS:168}
    upload-task-retention-hours: ${DATA_CLEANUP_UPLOAD_TASK_RETENTION_HOURS:24}
    deleted-file-retention-hours: ${DATA_CLEANUP_DELETED_FILE_RETENTION_HOURS:24}
    import-stage-retention-hours: ${DATA_CLEANUP_IMPORT_STAGE_RETENTION_HOURS:24}
    import-version-cleanup-enabled: ${DATA_CLEANUP_IMPORT_VERSION_CLEANUP_ENABLED:true}
    import-version-retain-count: ${DATA_CLEANUP_IMPORT_VERSION_RETAIN_COUNT:2}
    distributed-lock-enabled: ${DATA_CLEANUP_DISTRIBUTED_LOCK_ENABLED:true}
    lock-key: ${DATA_CLEANUP_LOCK_KEY:cleanup:retention:lock}
    lock-ttl-seconds: ${DATA_CLEANUP_LOCK_TTL_SECONDS:1800}

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: when_authorized
