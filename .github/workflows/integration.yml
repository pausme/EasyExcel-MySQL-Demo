name: Integration

on:
  workflow_dispatch:
  schedule:
    - cron: "0 20 * * 0"

jobs:
  integration-test:
    name: Docker integration tests
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 8
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "8"
          cache: maven

      - name: Show Docker versions
        run: |
          docker version
          docker compose version

      - name: Validate integration script
        run: bash -n scripts/run_integration_tests.sh

      - name: Run integration tests
        env:
          MAVEN_BIN: mvn
          INTEGRATION_APP_PORT: "18088"
          INTEGRATION_MYSQL_PORT: "23306"
          INTEGRATION_REDIS_PORT: "26379"
          INTEGRATION_MINIO_API_PORT: "29000"
          INTEGRATION_MINIO_CONSOLE_PORT: "29001"
        run: scripts/run_integration_tests.sh

      - name: Upload integration artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: integration-artifacts
          path: |
            target/integration-test/
            target/surefire-reports/
            docs/test/live-test-results.json
          if-no-files-found: ignore
